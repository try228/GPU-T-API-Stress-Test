name: Build GPU-T D3D Payload (Native AOT)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-d3d-payload:
    name: Build Windows D3D Payload (Native AOT)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Slang Compiler
        shell: pwsh
        run: |
          Write-Host "[CI] Fetching latest Slang compiler release..."
          $headers = @{ "User-Agent" = "GPU-T-CI" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shader-slang/slang/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*windows-x86_64.zip" } | Select-Object -First 1
          if (-not $asset) {
              throw "Could not find windows-x86_64.zip asset in Slang release!"
          }
          Write-Host "[CI] Downloading $($asset.name) from $($asset.browser_download_url)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\slang.zip"
          Expand-Archive "$env:TEMP\slang.zip" -DestinationPath "$env:USERPROFILE\slang" -Force
          "$env:USERPROFILE\slang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "[CI] Slang compiler installed successfully."

      - name: Verify Slang Compiler
        run: |
          slangc -v

      - name: Publish D3D Payload as Native AOT
        run: |
          dotnet publish Payloads/D3DPayload/D3DPayload.csproj -c Release -r win-x64 -p:PublishAot=true -o ./publish-payload

      - name: Upload D3D Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d-payload
          path: ./publish-payload/d3d_stress.exe