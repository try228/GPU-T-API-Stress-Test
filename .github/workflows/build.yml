name: Build & Package GPU-T Stress Test (Native AOT)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-d3d-payload:
    name: Build Windows D3D Payload (Native AOT)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish D3D Payload as Native AOT
        shell: bash
        run: |
          # Автоматически находим .csproj пейлоада без риска опечатки в регистре
          PAYLOAD_PROJ=$(find Payloads -name "*D3DPayload*.csproj" | head -n 1)
          dotnet publish "$PAYLOAD_PROJ" -c Release -r win-x64 /p:PublishAot=true -o ./publish-payload

      - name: Upload D3D Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d-payload
          path: ./publish-payload/d3d_stress.exe

  build-linux-sidecar:
    name: Build Linux Sidecar & Package
    runs-on: ubuntu-latest
    needs: build-d3d-payload
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libvulkan-dev libglfw3-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux Agent (Native AOT)
        run: |
          # Автоматически находим основной .csproj (исключая Payloads) с учетом регистра
          MAIN_PROJ=$(find . -maxdepth 2 -name "*Stress*.csproj" -not -path "*/Payloads/*" | head -n 1)
          echo "Found project: $MAIN_PROJ"
          dotnet publish "$MAIN_PROJ" -c Release -r linux-x64 -o ./publish-linux

      - name: Download Windows D3D Payload
        uses: actions/download-artifact@v4
        with:
          name: d3d-payload
          path: ./publish-linux/payloads

      - name: Upload Final Release Package
        uses: actions/upload-artifact@v4
        with:
          name: GPU-T-StressTest-Linux-AOT
          path: ./publish-linux/